<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Classmate</title>
  <meta name="description" content="A modern, minimal collaborative platform built for students and educators to share knowledge, organize study resources, and connect with peers seamlessly." />
  
  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  
  <style>
    :root {
      --bg-primary: #090a0f;
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --font-sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    [data-theme="light"] {
      --bg-primary: #ffffff;
      --text-primary: #0f172a;
      --text-secondary: #475569;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-sans);
      background-color: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
    }

    .container {
      max-width: 600px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.25rem;
    }

    h1 {
      font-size: 3rem;
      font-weight: 700;
      letter-spacing: -0.04em;
      color: var(--text-primary);
      line-height: 1.1;
    }

    p {
      font-size: 1.15rem;
      color: var(--text-secondary);
      line-height: 1.65;
      font-weight: 400;
      max-width: 520px;
    }

    @media (max-width: 640px) {
      h1 {
        font-size: 2.25rem;
      }
      p {
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>
  <main class="container">
    <h1>classmate</h1>
    <p>
      A modern, minimal collaborative platform built for students and educators to share knowledge, organize study resources, and connect with peers seamlessly.
    </p>
  </main>
</body>
</html>
