<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Classmate — PDF Upload</title>
  <meta name="description" content="A minimal PDF upload interface for Classmate. Drop study materials and notes." />
  
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <style>
    :root {
      --bg-primary: #090a0f;
      --bg-secondary: #0f1219;
      --bg-tertiary: #161a24;
      --bg-elevated: #1c212e;
      --border-subtle: #202634;
      --border-medium: #2b3346;
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --emerald-primary: #10b981;
      --emerald-subtle: rgba(16, 185, 129, 0.1);
      --rose-primary: #ef4444;
      --rose-subtle: rgba(239, 68, 68, 0.1);
      --radius-xs: 4px;
      --radius-sm: 6px;
      --radius-md: 10px;
      --font-sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
      --transition-fast: 0.15s ease;
    }

    [data-theme="light"] {
      --bg-primary: #ffffff;
      --bg-secondary: #f8fafc;
      --bg-tertiary: #f1f5f9;
      --bg-elevated: #ffffff;
      --border-subtle: #e2e8f0;
      --border-medium: #cbd5e1;
      --text-primary: #0f172a;
      --text-secondary: #475569;
      --text-muted: #94a3b8;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-sans);
      background-color: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      line-height: 1.6;
    }

    .container {
      width: 100%;
      max-width: 680px;
      margin: 0 auto;
      padding: 0 1.5rem;
    }

    /* Header */
    .header {
      border-bottom: 1px solid var(--border-subtle);
      background: var(--bg-secondary);
    }

    .header-inner {
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      text-decoration: none;
      color: inherit;
    }

    .brand-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--emerald-primary);
    }

    .brand-name {
      font-weight: 700;
      font-size: 1.05rem;
      letter-spacing: -0.03em;
    }

    .theme-btn {
      width: 32px;
      height: 32px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-subtle);
      background: var(--bg-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-secondary);
      cursor: pointer;
    }

    /* Main Content */
    .main-content {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 0;
    }

    .content-container {
      display: flex;
      flex-direction: column;
      gap: 1.75rem;
    }

    .intro-section {
      text-align: center;
    }

    .main-title {
      font-size: 2.4rem;
      font-weight: 700;
      letter-spacing: -0.04em;
      margin-bottom: 0.6rem;
    }

    .main-desc {
      font-size: 1rem;
      color: var(--text-secondary);
      max-width: 540px;
      margin: 0 auto;
      line-height: 1.6;
    }

    /* Upload Zone */
    .upload-zone {
      position: relative;
      border: 1px dashed var(--border-medium);
      border-radius: var(--radius-md);
      background: var(--bg-secondary);
      padding: 3.5rem 2rem;
      text-align: center;
      cursor: pointer;
      transition: all var(--transition-fast);
    }

    .upload-zone:hover, .upload-zone.dragging {
      border-color: var(--text-primary);
      background: var(--bg-tertiary);
    }

    .file-input-hidden {
      display: none;
    }

    .upload-zone-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.85rem;
    }

    .icon-wrap {
      width: 48px;
      height: 48px;
      border-radius: var(--radius-sm);
      background: var(--bg-primary);
      border: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-secondary);
      font-size: 1.25rem;
    }

    .upload-text-group {
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
    }

    .upload-heading {
      font-size: 1rem;
      font-weight: 600;
      color: var(--text-primary);
    }

    .upload-hint {
      font-size: 0.82rem;
      color: var(--text-muted);
    }

    .upload-progress-overlay {
      position: absolute;
      inset: 0;
      background: var(--bg-secondary);
      border-radius: var(--radius-md);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      padding: 1.5rem;
    }

    .progress-info {
      display: flex;
      justify-content: space-between;
      width: 100%;
      max-width: 360px;
      font-size: 0.82rem;
      font-family: var(--font-mono);
    }

    .progress-bar-track {
      width: 100%;
      max-width: 360px;
      height: 5px;
      background: var(--border-subtle);
      border-radius: 3px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      background: var(--text-primary);
      width: 0%;
      transition: width 0.15s ease;
    }

    /* Uploaded Status Card */
    .uploaded-status-card {
      display: none;
      align-items: center;
      justify-content: space-between;
      padding: 0.85rem 1rem;
      border-radius: var(--radius-sm);
      background: var(--bg-secondary);
      border: 1px solid var(--border-subtle);
    }

    .uploaded-info {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      min-width: 0;
    }

    .uploaded-name {
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text-primary);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .uploaded-size {
      font-size: 0.75rem;
      font-family: var(--font-mono);
      color: var(--text-muted);
    }

    .status-tag {
      font-size: 0.72rem;
      font-family: var(--font-mono);
      padding: 0.15rem 0.45rem;
      border-radius: var(--radius-xs);
      background: var(--emerald-subtle);
      color: var(--emerald-primary);
    }

    .toast-alert {
      position: fixed;
      bottom: 1.5rem;
      right: 1.5rem;
      display: none;
      align-items: center;
      gap: 0.5rem;
      padding: 0.65rem 1rem;
      border-radius: var(--radius-sm);
      background: var(--bg-elevated);
      border: 1px solid var(--emerald-primary);
      font-size: 0.82rem;
      color: var(--text-primary);
      z-index: 1000;
    }

    @media (max-width: 640px) {
      .main-title { font-size: 1.85rem; }
      .upload-zone { padding: 2.5rem 1.25rem; }
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="container header-inner">
      <a href="#" class="brand">
        <span class="brand-dot"></span>
        <span class="brand-name">classmate</span>
      </a>
      <button class="theme-btn" id="theme-btn" title="Toggle Theme">
        <i class="fa-solid fa-sun"></i>
      </button>
    </div>
  </header>

  <main class="main-content">
    <div class="container content-container">
      <div class="intro-section">
        <h1 class="main-title">Upload Study PDF</h1>
        <p class="main-desc">
          Drop your course notes, textbook chapters, or lecture slides to extract summaries and study materials.
        </p>
      </div>

      <!-- Dropzone -->
      <div class="upload-zone" id="upload-zone">
        <input type="file" id="file-input" class="file-input-hidden" accept=".pdf" />
        <div class="upload-zone-content">
          <div class="icon-wrap"><i class="fa-solid fa-cloud-arrow-up"></i></div>
          <div class="upload-text-group">
            <h3 class="upload-heading">Click to browse or drop your PDF here</h3>
            <p class="upload-hint">Supports PDF files up to 50MB</p>
          </div>
        </div>
        <div class="upload-progress-overlay" id="progress-overlay">
          <div class="progress-info">
            <span id="progress-name">Uploading...</span>
            <span id="progress-percent">0%</span>
          </div>
          <div class="progress-bar-track">
            <div class="progress-bar-fill" id="progress-fill"></div>
          </div>
        </div>
      </div>

      <!-- Uploaded Status Pill -->
      <div class="uploaded-status-card" id="status-card">
        <div class="uploaded-info">
          <i class="fa-solid fa-file-circle-check" style="color: var(--emerald-primary)"></i>
          <span class="uploaded-name" id="card-name">Document.pdf</span>
          <span class="uploaded-size" id="card-size">(2.4 MB)</span>
        </div>
        <span class="status-tag">Ready</span>
      </div>
    </div>
  </main>

  <div class="toast-alert" id="toast"><i class="fa-solid fa-circle-check" style="color: var(--emerald-primary)"></i> <span id="toast-text"></span></div>

  <script>
    const themeBtn = document.getElementById('theme-btn');
    const uploadZone = document.getElementById('upload-zone');
    const fileInput = document.getElementById('file-input');
    const toast = document.getElementById('toast');
    const toastText = document.getElementById('toast-text');
    const progressOverlay = document.getElementById('progress-overlay');
    const progressFill = document.getElementById('progress-fill');
    const progressPercent = document.getElementById('progress-percent');
    const progressName = document.getElementById('progress-name');
    const statusCard = document.getElementById('status-card');
    const cardName = document.getElementById('card-name');
    const cardSize = document.getElementById('card-size');

    themeBtn.addEventListener('click', () => {
      const current = document.documentElement.getAttribute('data-theme');
      const next = current === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      themeBtn.innerHTML = next === 'dark' ? '<i class="fa-solid fa-sun"></i>' : '<i class="fa-solid fa-moon"></i>';
    });

    uploadZone.addEventListener('click', () => fileInput.click());

    fileInput.addEventListener('change', (e) => {
      if (e.target.files.length > 0) {
        const file = e.target.files[0];
        if (!file.name.toLowerCase().endsWith('.pdf')) {
          showToast('Please upload a valid .pdf file');
          return;
        }
        progressOverlay.style.display = 'flex';
        progressName.textContent = file.name;
        let p = 10;
        const timer = setInterval(() => {
          p += 20;
          progressPercent.textContent = p + '%';
          progressFill.style.width = p + '%';
          if (p >= 100) {
            clearInterval(timer);
            setTimeout(() => {
              progressOverlay.style.display = 'none';
              const sizeStr = file.size > 1024*1024 ? (file.size/(1024*1024)).toFixed(1) + ' MB' : Math.round(file.size/1024) + ' KB';
              cardName.textContent = file.name;
              cardSize.textContent = '(' + sizeStr + ')';
              statusCard.style.display = 'flex';
              showToast('Uploaded ' + file.name + ' successfully');
            }, 300);
          }
        }, 150);
      }
    });

    function showToast(msg) {
      toastText.textContent = msg;
      toast.style.display = 'inline-flex';
      setTimeout(() => toast.style.display = 'none', 3000);
    }
  </script>
</body>
</html>
